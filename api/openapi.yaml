openapi: 3.0.3
info:
  title: TTSR API
  version: 1.0.0
  description: Travel Trust & Safety Risk Scorer (rules v0) with OAuth2 CC, idempotency, and HMAC webhooks.
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth2/token
          scopes:
            score:write: Submit events for scoring
            events:read: Read scored events
  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current window.
      schema: { type: integer, example: 1000 }
    X-RateLimit-Remaining:
      description: The number of remaining requests in the current window.
      schema: { type: integer, example: 999 }
    X-RateLimit-Reset:
      description: Epoch seconds when the current window resets.
      schema: { type: integer, example: 1760990000 }
  schemas:
    ScoreRequest:
      type: object
      required: [event_id, source, signals]
      properties:
        event_id: { type: string, example: evt-001 }
        source: { type: string, example: flight }
        signals:
          type: object
          additionalProperties: { type: number }
          example: { delay: 0.7, weather: 0.5, geo: 0.2, payment: 0 }
    ScoreResponse:
      type: object
      required: [event_id, score, action]
      properties:
        event_id: { type: string, example: evt-001 }
        score: { type: number, format: float, example: 42.5 }
        action: { type: string, enum: [allow, review, hold], example: review }
        trace_id: { type: string, example: 1-68f68b2c-a657fe81740a2939 }
    Event:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string, example: demo }
        source: { type: string, example: flight }
        ts: { type: integer, example: 1760984156 }
        signals:
          type: object
          additionalProperties: { type: number }
        score_v: { type: string, example: v0_rules }
        score: { type: number }
        action: { type: string, enum: [allow, review, hold] }
        idempotency_key: { type: string }
        status: { type: string, example: scored }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        trace_id: { type: string }
paths:
  /v1/health:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  ts: { type: integer }
  /v1/oauth2/token:
    post:
      tags: [Auth]
      summary: OAuth2 Client Credentials token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string, example: "score:write events:read" }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, example: 3600 }
                  scope: { type: string }
  /v1/score:
    post:
      tags: [Scoring]
      summary: Submit an event for scoring (idempotent)
      security:
        - oauth2: [score:write]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreRequest' }
      responses:
        "202":
          description: Accepted
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreResponse' }
        "400":
          description: Bad Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /v1/events/{id}:
    get:
      tags: [Events]
      summary: Fetch a scored event by id
      security:
        - oauth2: [events:read]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event found
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
